services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
      - ./settings.docker.toml:/app/settings.toml:ro
      # Mount your vault/corpus directory here:
      # - /path/to/your/vault:/data/vault:ro
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
