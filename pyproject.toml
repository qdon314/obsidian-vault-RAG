[project]
name = "rag-obsidian"
version = "0.1.0"
description = "Local-first RAG system over an Obsidian vault with retrieval logging and grounded generation"
readme = "README.md"
requires-python = ">=3.11"

authors = [
  { name = "Quentin Donnelly" }
]

keywords = [
  "rag",
  "llm",
  "retrieval",
  "embeddings",
  "obsidian"
]

dependencies = [
  "python-dotenv",
  "dataclasses-json>=0.6.0",
  "numpy>=1.26.0",
  "openai>=1.0.0",
]

[project.optional-dependencies]
# Kept for backward compatibility with existing install commands.
openai = []

ui = [
  "streamlit>=1.30.0",
  "plotly>=5.18.0",
]

qdrant = [
  "qdrant-client>=1.7.0",
]

nrc = [
  "httpx>=0.27.0",
]

aws = [
  "boto3>=1.34.0",
]

distributed = [
  "boto3>=1.34.0",
  "psycopg2-binary>=2.9.0",
  "qdrant-client>=1.7.0",
]

proposition = [
  "torch",
  "transformers",
  "sentencepiece",
  "llama-cpp-python",
]

dev = [
  "pytest",
  "mypy",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

# What Ruff checks
lint.select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # simplifications
    "C4",   # comprehensions
    # "T20",  # print statements | TODO: enable later when logging is fully in place
    "RUF",  # ruff-specific,
    "N",    # naming conventions
]

# What Ruff ignores
lint.ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function calls in defaults (often intentional)
]

# Paths Ruff should ignore entirely
exclude = [
    ".venv",
    "__pycache__",
    "data",
    "logs",
    "notebooks",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.ruff.per-file-ignores]
"tests/**.py" = ["N801", "N802", "N803", "N806"]  # soften just the annoying ones
"scripts/**.py" = ["N"]  # disable all naming checks for scripts

[tool.mypy]
mypy_path = ["src"]
explicit_package_bases = true

