[project]
name = "rag-obsidian"
version = "0.1.0"
description = "Local-first RAG system over an Obsidian vault with retrieval logging and grounded generation"
readme = "README.md"
requires-python = ">=3.11"

authors = [
  { name = "Quentin Donnelly" }
]

keywords = [
  "rag",
  "llm",
  "retrieval",
  "embeddings",
  "obsidian",
  "chroma"
]

dependencies = [
  "llama-index",
  "chromadb",
  "sentence-transformers",
  "python-dotenv",
  "rich",

  # LlamaIndex integrations
  "llama-index-vector-stores-chroma",
  "llama-index-embeddings-huggingface"
]

[project.optional-dependencies]
ollama = [
  "llama-index-llms-ollama"
]

openai = [
  "openai",
  "llama-index-llms-openai"
]

dev = [
  "pytest",
  "ruff",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

# What Ruff checks
lint.select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # simplifications
    "C4",   # comprehensions
    # "T20",  # print statements | TODO: enable later when logging is fully in place
    "RUF",  # ruff-specific,
    "N",    # naming conventions
]

# What Ruff ignores
lint.ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function calls in defaults (often intentional)
]

# Paths Ruff should ignore entirely
exclude = [
    ".venv",
    "__pycache__",
    "data",
    "logs",
    "notebooks",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.ruff.per-file-ignores]
"tests/**.py" = ["N801", "N802", "N803", "N806"]  # soften just the annoying ones
"scripts/**.py" = ["N"]  # disable all naming checks for scripts



