# Canonical configuration for the RAG system
# Settings define defaults.
# Containers compose adapters.
# CLI overrides settings via ContainerOverrides.
#
# TODO: Migrate backend-specific settings to nested TOML tables
# (e.g. [retrieval.hybrid], [vectorstore.qdrant], [embeddings.openai])
# to improve readability as the number of backends grows.


# -------------------------------------------------------------------
# Paths
# -------------------------------------------------------------------
[paths]
vault_dir = "/Users/quentindonnelly/Documents/Personal & Professional"
artifacts_dir = "artifacts"
queries_file = "eval/datasets/curated_queries.jsonl"

# Default index location (used unless overridden by CLI)
index_dir = "artifacts/indexes/obsidian"


# -------------------------------------------------------------------
# Ingestion
# -------------------------------------------------------------------
[ingestion]
recursive = true
skip_hidden = true
allowed_extensions = [".md", ".txt"]

# Obsidian-specific options
expand_embeds = true
max_embed_depth = 4


# -------------------------------------------------------------------
# Chunking
# -------------------------------------------------------------------
[chunking]
backend = "obsidian_structural" # "fixed" | "obsidian_structural" | "obsidian_proposition"

# Simple fixed-size chunker options
chunk_size = 800
overlap = 120

# Obsidian structural chunker options
target_chars = 4000
hard_max_chars = 5200
overlap_blocks = 1
include_heading_preamble = true

# Obsidian proposition chunker options
proposition_batch_size = 2  # passages per T5 forward pass (increase for GPU)

# -------------------------------------------------------------------
# Context building
# -------------------------------------------------------------------
[context]
max_chunks = 5
dedupe = true
include_scores = false
# min_score = ...        # optional similarity cutoff
token_budget = 1500


# -------------------------------------------------------------------
# Embeddings
# -------------------------------------------------------------------
[embeddings]
backend = "openai"         # "openai" | "dummy"
model = "text-embedding-3-large"
timeout = 30.0
max_retries = 3
cache_embeddings = true
cache_db_path = "artifacts/cache/embeddings/embedding_cache.db"

# Used only when backend = "dummy"
dummy_dim = 128


# -------------------------------------------------------------------
# Vector store
# -------------------------------------------------------------------
[vectorstore]
backend = "qdrant"         # "memory" | "jsonl" | "qdrant"

# Used only when backend = "jsonl"
jsonl_dir = "artifacts/indexes/obsidian_index"

# Used only when backend = "qdrant"
qdrant_collection = "regulatory"
qdrant_url = "http://localhost:6333"  # for remote Qdrant server
qdrant_path = "artifacts/indexes"      # for local disk persistence
# qdrant_api_key = "..."                # for Qdrant Cloud


# -------------------------------------------------------------------
# Retrieval
# -------------------------------------------------------------------
[retrieval]
backend = "vector"            # "vector" | "hybrid"
top_k = 10

# Hybrid retrieval settings (only used when backend = "hybrid")

# Weights for combining vector similarity and BM25 scores.
# Higher values favor vector similarity.
hybrid_primary_weight = 0.7

# Secondary score weight is 1 - primary_weight, but can be adjusted independently to allow for overall score scaling.
hybrid_secondary_weight = 0.3

# Number of top results to consider for RRF (Reciprocal Rank Fusion)
hybrid_rrf_k = 60

# BM25 parameters (only used for the BM25 component of hybrid retrieval)
hybrid_bm25_k1 = 1.5

# BM25 b parameter (controls the influence of document length normalization)
hybrid_bm25_b = 0.75


# -------------------------------------------------------------------
# Reranking
# -------------------------------------------------------------------
[rerank]
enabled = true
backend = "heuristic"      # "heuristic" | "noop"
keep_k = 4


# -------------------------------------------------------------------
# Chunk storage (distributed mode)
# -------------------------------------------------------------------
[chunk_storage]
backend = "none"              # "none" | "s3"
s3_bucket = "obsidian-rag-corpus"
s3_prefix = "chunks"
postgres_dsn = "postgresql://rag:1p0Wnoob$@obsidian-rag-ingest.cwzscuw2msbg.us-east-1.rds.amazonaws.com:5432/rag"
max_s3_workers = 4


# -------------------------------------------------------------------
# Distributed ingestion (Phase 3)
# -------------------------------------------------------------------
[distributed_ingestion]
enabled = false
postgres_dsn = "postgresql://rag:1p0Wnoob$@obsidian-rag-ingest.cwzscuw2msbg.us-east-1.rds.amazonaws.com:5432/rag"
sqs_queue_url = "https://sqs.us-east-1.amazonaws.com/169328859586/obsidian-rag-ingest-tasks"
corpus_s3_bucket = "obsidian-rag-corpus"
corpus_s3_prefix = "regulatory"
worker_lease_duration_s = 300
max_task_retries = 3


# -------------------------------------------------------------------
# NRC ADAMS API
# -------------------------------------------------------------------
[nrc_adams]
base_url = "https://adams-api.nrc.gov/aps/api"
timeout = 30.0
page_size = 100
max_retries = 3
# subscription_key comes from env var NRC_ADAMS_API_KEY (see .env.example)


# -------------------------------------------------------------------
# Case Document Ingestion
# -------------------------------------------------------------------
[case_ingestion]
output_dir = "corpus/us-nrc/cases"
document_types = ["Inspection Report", "Special Inspection", "Part 21 Correspondence"]


# -------------------------------------------------------------------
# LLM / Generation
# -------------------------------------------------------------------
[llm]
backend = "openai"
model = "gpt-4.1-mini"
temperature = 0.2
max_tokens = 1024
timeout = 60.0
max_retries = 3


# -------------------------------------------------------------------
# Prompt Compression (ScaleDown)
# -------------------------------------------------------------------
[compression]
enabled = true
backend = "scaledown"              # "noop" | "scaledown"
api_url = "https://api.scaledown.xyz/compress/raw/"
rate = "auto"
prompt_template = "{query}"   # {query} is interpolated
timeout_s = 10.0
max_retries = 2
fail_open = true              # fall back to uncompressed on API error
# api_key comes from env var SCALEDOWN_API_KEY (see .env.example)


# -------------------------------------------------------------------
# Eval Verdict Gating
# -------------------------------------------------------------------
[eval.verdict]
# Global fallback thresholds (used when no --scope is provided).
min_recall_at_10 = 0.60
min_ndcg_at_10 = 0.50
min_mrr = 0.40
max_avg_hallucination_severity = 2.5
min_evidence_bounded_rate = 0.70
max_latency_p95_ms = 5000.0
max_unsafe_miss_rate = 0.10
max_abstain_bad_rate = 0.10

[eval.verdict.case]
# Thresholds for NRC case-derived queries (--scope case).
min_recall_at_10 = 0.50
min_ndcg_at_10 = 0.40
min_mrr = 0.30
max_avg_hallucination_severity = 2.5
min_evidence_bounded_rate = 0.70
max_latency_p95_ms = 5000.0
max_unsafe_miss_rate = 0.10
max_abstain_bad_rate = 0.10

[eval.verdict.regulatory]
# Thresholds for regulatory adversarial queries (--scope regulatory).
min_recall_at_10 = 0.60
min_ndcg_at_10 = 0.50
min_mrr = 0.40
max_avg_hallucination_severity = 2.5
min_evidence_bounded_rate = 0.70
max_latency_p95_ms = 5000.0
max_unsafe_miss_rate = 0.10
max_abstain_bad_rate = 0.10
