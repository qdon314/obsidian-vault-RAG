# Canonical configuration for the RAG system
# Settings define defaults.
# Containers compose adapters.
# CLI overrides settings via ContainerOverrides.


# -------------------------------------------------------------------
# Paths
# -------------------------------------------------------------------
[paths]
vault_dir = "~/obsidian-vault"
artifacts_dir = "artifacts"

# Default index location (used unless overridden by CLI)
index_dir = "artifacts/indexes/default"


# -------------------------------------------------------------------
# Ingestion
# -------------------------------------------------------------------
[ingestion]
recursive = true
skip_hidden = true
allowed_extensions = [".md", ".txt"]

# Obsidian-specific options
expand_embeds = true
max_embed_depth = 4


# -------------------------------------------------------------------
# Chunking
# -------------------------------------------------------------------
[chunking]
backend = "obsidian_structural" # "fixed" | "obsidian_structural" | "obsidian_proposition"

# Simple fixed-size chunker options
chunk_size = 800
overlap = 120

# Obsidian structural chunker options
target_chars = 4000
hard_max_chars = 5200
overlap_blocks = 1
include_heading_preamble = true

# Obsidian proposition chunker options
proposition_batch_size = 8  # passages per T5 forward pass (increase for GPU)

# -------------------------------------------------------------------
# Context building
# -------------------------------------------------------------------
[context]
max_chunks = 5
dedupe = true
include_scores = false
# min_score = ...        # optional similarity cutoff
token_budget = 1500


# -------------------------------------------------------------------
# Embeddings
# -------------------------------------------------------------------
[embeddings]
backend = "openai"         # "openai" | "dummy"
model = "text-embedding-3-large"
timeout = 30.0
max_retries = 3
cache_embeddings = true
cache_db_path = "artifacts/cache/embeddings/embedding_cache.db"

# Used only when backend = "dummy"
dummy_dim = 128


# -------------------------------------------------------------------
# Vector store
# -------------------------------------------------------------------
[vectorstore]
backend = "jsonl"         # "memory" | "jsonl" | "qdrant"

# Used only when backend = "jsonl"
jsonl_dir = "artifacts/indexes/obsidian_index"

# Used only when backend = "qdrant"
# qdrant_collection = "chunks"
# qdrant_url = "http://localhost:6333"  # for remote Qdrant server
# qdrant_path = "artifacts/qdrant"      # for local disk persistence
# qdrant_api_key = "..."                # for Qdrant Cloud


# -------------------------------------------------------------------
# Retrieval
# -------------------------------------------------------------------
[retrieval]
backend = "vector"            # "vector" | "hybrid"
top_k = 8

# Hybrid retrieval settings (only used when backend = "hybrid")
# hybrid_primary_weight = 0.7
# hybrid_secondary_weight = 0.3
# hybrid_rrf_k = 60
# hybrid_bm25_k1 = 1.5
# hybrid_bm25_b = 0.75


# -------------------------------------------------------------------
# Reranking
# -------------------------------------------------------------------
[rerank]
enabled = true
backend = "heuristic"      # "heuristic" | "noop"
keep_k = 4


# -------------------------------------------------------------------
# LLM / Generation
# -------------------------------------------------------------------
[llm]
backend = "openai"
model = "gpt-4.1-mini"
temperature = 0.2
max_tokens = 1024
timeout = 60.0
max_retries = 3


# -------------------------------------------------------------------
# Eval Verdict Gating
# -------------------------------------------------------------------
[eval.verdict]
# Absolute thresholds + regression tolerances for release gating.
min_recall_at_10 = 0.60
min_ndcg_at_10 = 0.50
min_mrr = 0.40
max_avg_hallucination_severity = 2.5
min_evidence_bounded_rate = 0.70
max_latency_p95_ms = 5000.0
max_unsafe_miss_rate = 0.10
max_abstain_bad_rate = 0.10
max_recall_regression = 0.05
max_quality_regression = 0.10
max_latency_regression_ms = 1000.0
